services:
  pgvector:
    image: pgvector/pgvector:pg15
    container_name: pgvector
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sa_manual_db

    ports:
      - "5435:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - sa_manual

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: sa_pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - pgvector

    networks:
      - sa_manual

  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - sa_manual

networks:
  sa_manual:

volumes:
  pgdata:
  postgres_data:
  ollama_data: